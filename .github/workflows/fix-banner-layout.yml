name: Fix vendor banner layout

on:
  push:
    branches: [test/all-vendor]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-vendor
          fetch-depth: 0

      - name: Fix banner layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/app/components/pages/Profile.tsx')
          s = p.read_text()

          old_grid = 'className="grid grid-cols-1 md:grid-cols-2 gap-4"'
          new_grid = 'className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5 items-start"'
          if old_grid not in s:
              raise SystemExit('banner grid pattern not found')
          s = s.replace(old_grid, new_grid, 1)

          old_card = 'className="relative h-[160px] w-full rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-900 group bg-slate-50 dark:bg-slate-955"'
          new_card = 'className="relative w-full aspect-[8/3] rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-900 group bg-slate-50 dark:bg-slate-955"'
          if old_card not in s:
              raise SystemExit('banner card pattern not found')
          s = s.replace(old_card, new_card, 1)

          old_img = 'className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-102"'
          new_img = 'className="w-full h-full object-contain transition-transform duration-500 group-hover:scale-102"'
          if old_img not in s:
              raise SystemExit('banner image pattern not found')
          s = s.replace(old_img, new_img, 1)

          old_overlay = '<div className="absolute inset-0 bg-gradient-to-t from-slate-955 via-transparent to-transparent z-10" />'
          if old_overlay in s:
              s = s.replace(old_overlay, '<div className="absolute inset-0 pointer-events-none" />', 1)

          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/components/pages/Profile.tsx
          git diff --cached --quiet || git commit -m "Fix vendor banner layout"
          git push origin test/all-vendor
