name: Apply product multi-image v2

on:
  push:
    branches: [test/all-vendor]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-vendor
          fetch-depth: 0

      - name: Apply multi-image product editor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/components/pages/AddEditProduct.tsx')
          s = p.read_text()

          # State
          if 'const [imageFiles, setImageFiles]' not in s:
              s = s.replace(
                  '  const [imageFile, setImageFile] = useState<File | null>(null);',
                  '  const [imageFile, setImageFile] = useState<File | null>(null);\n  const [imageFiles, setImageFiles] = useState<File[]>([]);'
              )

          # Existing product image parsing + multi-file selection/removal.
          marker = '  const validateAndSetImage = (file: File) => {'
          if 'const parseImageUrls' not in s:
              replacement = '''  const parseImageUrls = (value: unknown): string[] => {
    if (!value) return [];
    if (Array.isArray(value)) {
      return value.filter((item): item is string => typeof item === "string" && !!item);
    }
    if (typeof value !== "string") return [];
    try {
      const parsed = JSON.parse(value);
      if (Array.isArray(parsed)) {
        return parsed.filter((item): item is string => typeof item === "string" && !!item);
      }
    } catch {}
    return [value];
  };

  const validateAndSetImages = (files: File[]) => {
    const selected = files.filter(Boolean).slice(0, 5);
    if (!selected.length) return;

    const validTypes = ["image/jpeg", "image/jpg", "image/png", "image/webp"];
    const invalid = selected.find(file => !validTypes.includes(file.type) || file.size > 5 * 1024 * 1024);
    if (invalid) {
      alert("Each product image must be JPG, JPEG, PNG, or WEBP and under 5MB.");
      return;
    }

    setImageFiles(selected);
    setImageFile(selected[0]);
    setImageUrl(URL.createObjectURL(selected[0]));
    setIsImageError(false);
  };

  const handleRemoveSelectedImage = (index: number) => {
    const next = imageFiles.filter((_, i) => i !== index);
    setImageFiles(next);
    setImageFile(next[0] || null);
    setImageUrl(next[0] ? URL.createObjectURL(next[0]) : "");
    setIsImageError(false);
  };

  const validateAndSetImage = (file: File) => {'''
              if marker not in s:
                  raise SystemExit('image validation marker not found')
              s = s.replace(marker, replacement, 1)

          # Edit mode: display the first existing image and preserve the rest in the JSON field.
          s = s.replace(
              '      setImageUrl(product.image_url || "");',
              '      const existingImageUrls = parseImageUrls(product.image_url);\n      setImageUrl(existingImageUrls[0] || "");\n      setImageFiles([]);',
              1
          )
          s = s.replace(
              '      setImageUrl("");\n      setImageFile(null);\n      setIsImageError(false);',
              '      setImageUrl("");\n      setImageFile(null);\n      setImageFiles([]);\n      setIsImageError(false);',
              1
          )

          # Drag/drop and input now accept multiple images.
          s = s.replace(
              '      validateAndSetImage(e.dataTransfer.files[0]);',
              '      validateAndSetImages(Array.from(e.dataTransfer.files));',
              1
          )
          s = s.replace(
              '      validateAndSetImage(e.target.files[0]);',
              '      validateAndSetImages(Array.from(e.target.files));',
              1
          )
          s = s.replace(
              '              onChange={handleFileChange}\n              accept="image/jpeg, image/jpg, image/png, image/webp"',
              '              onChange={handleFileChange}\n              multiple\n              accept="image/jpeg, image/jpg, image/png, image/webp"',
              1
          )

          # Remove action clears the complete local selection.
          s = s.replace(
              '    setImageFile(null);\n    setIsImageError(false);',
              '    setImageFile(null);\n    setImageFiles([]);\n    setIsImageError(false);',
              1
          )

          # Replace the existing single-file upload block with a multi-file upload block.
          old_pattern = re.compile(r'''      let finalImageUrl = imageUrl;\n\n      if \(imageFile\) \{.*?        setIsUploading\(false\);\n      \}''', re.S)
          m = old_pattern.search(s)
          if not m:
              raise SystemExit('single-image upload block not found')
          new_block = '''      let finalImageUrl = imageUrl;

      if (imageFiles.length) {
        setIsUploading(true);
        const uploadedUrls: string[] = [];

        for (const file of imageFiles.slice(0, 5)) {
          const fileExt = file.name.split(".").pop() || "jpg";
          const fileName = `${crypto.randomUUID()}.${fileExt}`;

          const { error: uploadError } = await supabase.storage
            .from("product-images")
            .upload(fileName, file);

          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabase.storage
            .from("product-images")
            .getPublicUrl(fileName);

          uploadedUrls.push(publicUrlData.publicUrl);
        }

        finalImageUrl = uploadedUrls.length > 1
          ? JSON.stringify(uploadedUrls)
          : (uploadedUrls[0] || "");

        setIsUploading(false);
      }'''
          s = s[:m.start()] + new_block + s[m.end():]

          # Make the media card show all newly selected images, with numbered thumbnails and removal.
          old_media = re.compile(r'''            \{imageUrl &&\n            !isImageError \? \(.*?            \)\}\n\n          </div>''', re.S)
          mm = old_media.search(s)
          if not mm:
              raise SystemExit('product media preview block not found')
          new_media = '''            {imageUrl && !isImageError ? (
              <div className="space-y-3">
                <div className="relative group rounded-xl border border-border overflow-hidden bg-muted aspect-square w-full max-w-[240px] mx-auto">
                  <img
                    src={imageUrl}
                    alt="Product Preview"
                    onError={() => setIsImageError(true)}
                    className="w-full h-full object-contain"
                  />
                  <button
                    type="button"
                    onClick={handleRemoveImage}
                    className="absolute top-2 right-2 p-1.5 rounded-lg bg-black/60 text-white hover:bg-black/80 transition-colors"
                    title="Remove Images"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                {imageFiles.length > 0 && (
                  <div className="flex flex-wrap gap-2 justify-center">
                    {imageFiles.map((file, index) => (
                      <div key={`${file.name}-${index}`} className="relative w-16 h-16 rounded-lg overflow-hidden border border-border bg-muted">
                        <img
                          src={URL.createObjectURL(file)}
                          alt={`Product image ${index + 1}`}
                          className="w-full h-full object-cover"
                        />
                        <button
                          type="button"
                          onClick={() => handleRemoveSelectedImage(index)}
                          className="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/70 text-white flex items-center justify-center"
                          aria-label={`Remove image ${index + 1}`}
                        >
                          <X className="w-3 h-3" />
                        </button>
                        <span className="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[9px] text-center font-semibold">
                          {index + 1}
                        </span>
                      </div>
                    ))}
                  </div>
                )}

                <p className="text-[10px] text-muted-foreground text-center">
                  {imageFiles.length > 1 ? `${imageFiles.length} images selected` : "1 image selected"}. Maximum 5 images.
                </p>
              </div>
            ) : (
              <div
                onDragEnter={handleDrag}
                onDragOver={handleDrag}
                onDragLeave={handleDrag}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current?.click()}
                className={`border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-colors flex flex-col items-center justify-center gap-2 ${
                  isDragActive
                    ? "border-[#10B981] bg-[#10B981]/5"
                    : "border-border hover:border-[#10B981]"
                }`}
              >
                {isUploading ? (
                  <Loader2 className="w-6 h-6 animate-spin text-[#10B981]" />
                ) : (
                  <>
                    <Upload className="w-6 h-6 text-muted-foreground" />
                    <div>
                      <p className="text-xs font-medium text-foreground">
                        Click to upload up to 5 images
                      </p>
                      <p className="text-[10px] text-muted-foreground mt-0.5">
                        JPG, JPEG, PNG, WEBP • Max 5MB each
                      </p>
                    </div>
                  </>
                )}
              </div>
            )}

          </div>'''
          s = s[:mm.start()] + new_media + s[mm.end():]

          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/components/pages/AddEditProduct.tsx
          git diff --cached --quiet || git commit -m "Add multiple product image upload"
          git push origin test/all-vendor
