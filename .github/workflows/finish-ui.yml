name: Finish vendor UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-vendor
          fetch-depth: 0
      - name: Patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/components/pages/Profile.tsx'); s=p.read_text()
          s=s.replace('className="relative h-[160px] w-full rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-900 group bg-slate-50 dark:bg-slate-955"','className="relative w-full aspect-[8/3] min-h-[120px] rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-900 group bg-slate-50 dark:bg-slate-955"')
          s=s.replace('className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-102"','className="w-full h-full object-contain transition-transform duration-500 group-hover:scale-102"')
          p.write_text(s)
          p=Path('src/app/components/pages/AddEditProduct.tsx'); s=p.read_text()
          if 'imageFiles, setImageFiles' not in s:
              s=s.replace('const [imageFile, setImageFile] = useState<File | null>(null);','const [imageFile, setImageFile] = useState<File | null>(null);\n  const [imageFiles, setImageFiles] = useState<File[]>([]);')
          s=s.replace('''  const validateAndSetImage = (file: File) => {''','''  const validateAndSetImages = (files: File[]) => {
    const validTypes=["image/jpeg","image/jpg","image/png","image/webp"];
    if (!files.length) return;
    if (files.some(file=>!validTypes.includes(file.type)||file.size>5*1024*1024)) { alert("Each product image must be JPG, JPEG, PNG, or WEBP and under 5MB."); return; }
    const limited=files.slice(0,5); setImageFiles(limited); setImageFile(limited[0]); setImageUrl(URL.createObjectURL(limited[0])); setIsImageError(false);
  };

  const validateAndSetImage = (file: File) => {''')
          s=s.replace('validateAndSetImage(e.dataTransfer.files[0]);','validateAndSetImages(Array.from(e.dataTransfer.files));')
          s=s.replace('validateAndSetImage(e.target.files[0]);','validateAndSetImages(Array.from(e.target.files));')
          s=s.replace('ref={fileInputRef}\n        onChange={handleFileChange}','ref={fileInputRef}\n        multiple\n        onChange={handleFileChange}')
          s=s.replace('setImageFile(null);\n      setIsImageError(false);','setImageFile(null);\n      setImageFiles([]);\n      setIsImageError(false);')
          old=re.search(r'      let finalImageUrl = imageUrl;\n\n      if \(imageFile\) \{.*?      \}',s,re.S)
          if old:
              block='''      let finalImageUrl = imageUrl;

      if (imageFiles.length) {
        setIsUploading(true);
        const uploadedUrls: string[] = [];
        for (const file of imageFiles.slice(0, 5)) {
          const fileExt = file.name.split(".").pop() || "jpg";
          const fileName = `${crypto.randomUUID()}.${fileExt}`;
          const { error: uploadError } = await supabase.storage.from("product-images").upload(fileName, file);
          if (uploadError) throw uploadError;
          const { data: publicUrlData } = supabase.storage.from("product-images").getPublicUrl(fileName);
          uploadedUrls.push(publicUrlData.publicUrl);
        }
        finalImageUrl = uploadedUrls.length > 1 ? JSON.stringify(uploadedUrls) : (uploadedUrls[0] || "");
        setIsUploading(false);
      }'''
              s=s[:old.start()]+block+s[old.end():]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "src/app/components/pages/Profile.tsx" "src/app/components/pages/AddEditProduct.tsx"
          git commit -m "Fix vendor banner size and product image uploads"
          git push origin test/all-vendor
