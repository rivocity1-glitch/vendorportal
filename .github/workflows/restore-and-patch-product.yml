name: Restore and patch product images

on:
  push:
    branches: [test/all-vendor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-vendor
          fetch-depth: 0

      - name: Restore original and apply targeted multi-image changes
        shell: bash
        run: |
          set -e
          git checkout 55bfba103ae928584d9ba7e4eeb8a681cf37aae7 -- src/app/components/pages/AddEditProduct.tsx
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/app/components/pages/AddEditProduct.tsx')
          s=p.read_text()

          s=s.replace('  const [imageFile, setImageFile] = useState<File | null>(null);','  const [imageFile, setImageFile] = useState<File | null>(null);\n  const [imageFiles, setImageFiles] = useState<File[]>([]);')

          marker='  const validateAndSetImage = (file: File) => {'
          replacement='''  const validateAndSetImages = (files: File[]) => {
    const selected = files.filter(Boolean).slice(0, 5);
    if (!selected.length) return;

    const validTypes = ["image/jpeg", "image/jpg", "image/png", "image/webp"];
    if (selected.some(file => !validTypes.includes(file.type) || file.size > 5 * 1024 * 1024)) {
      alert("Each product image must be JPG, JPEG, PNG, or WEBP and under 5MB.");
      return;
    }

    setImageFiles(selected);
    setImageFile(selected[0]);
    setImageUrl(URL.createObjectURL(selected[0]));
    setIsImageError(false);
  };

  const handleRemoveSelectedImage = (index: number) => {
    const next = imageFiles.filter((_, i) => i !== index);
    setImageFiles(next);
    setImageFile(next[0] || null);
    setImageUrl(next[0] ? URL.createObjectURL(next[0]) : "");
    setIsImageError(false);
  };

  const validateAndSetImage = (file: File) => {'''
          if marker not in s: raise SystemExit('marker missing')
          s=s.replace(marker,replacement,1)

          s=s.replace('      setImageUrl(product.image_url || "");\n      setImageFile(null);','      setImageUrl(product.image_url || "");\n      setImageFile(null);\n      setImageFiles([]);',1)
          s=s.replace('      setImageUrl("");\n      setImageFile(null);\n      setIsImageError(false);','      setImageUrl("");\n      setImageFile(null);\n      setImageFiles([]);\n      setIsImageError(false);',1)

          s=s.replace('      validateAndSetImage(e.dataTransfer.files[0]);','      validateAndSetImages(Array.from(e.dataTransfer.files));',1)
          s=s.replace('      validateAndSetImage(e.target.files[0]);','      validateAndSetImages(Array.from(e.target.files));',1)
          s=s.replace('              ref={fileInputRef}\n              onChange={handleFileChange}\n              accept="image/jpeg, image/jpg, image/png, image/webp"','              ref={fileInputRef}\n              onChange={handleFileChange}\n              multiple\n              accept="image/jpeg, image/jpg, image/png, image/webp"',1)
          s=s.replace('    setImageFile(null);\n    setIsImageError(false);','    setImageFile(null);\n    setImageFiles([]);\n    setIsImageError(false);',1)

          old=re.compile(r'      let finalImageUrl = imageUrl;\n\n      if \(imageFile\) \{.*?        setIsUploading\(false\);\n      \}',re.S)
          m=old.search(s)
          if not m: raise SystemExit('upload block missing')
          new='''      let finalImageUrl = imageUrl;

      if (imageFiles.length) {
        setIsUploading(true);
        const uploadedUrls: string[] = [];

        for (const file of imageFiles.slice(0, 5)) {
          const fileExt = file.name.split(".").pop() || "jpg";
          const fileName = `${crypto.randomUUID()}.${fileExt}`;
          const { error: uploadError } = await supabase.storage
            .from("product-images")
            .upload(fileName, file);
          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabase.storage
            .from("product-images")
            .getPublicUrl(fileName);
          uploadedUrls.push(publicUrlData.publicUrl);
        }

        finalImageUrl = uploadedUrls.length > 1
          ? JSON.stringify(uploadedUrls)
          : (uploadedUrls[0] || "");
        setIsUploading(false);
      }'''
          s=s[:m.start()]+new+s[m.end():]

          # Add a thumbnail strip below the main preview without replacing the existing editor layout.
          anchor='''              </div>\n            ) : (\n              <div\n                onDragEnter={'''
          insert='''              </div>

                {imageFiles.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-3 justify-center">
                    {imageFiles.map((file, index) => (
                      <div key={`${file.name}-${index}`} className="relative w-16 h-16 rounded-lg overflow-hidden border border-border bg-muted">
                        <img src={URL.createObjectURL(file)} alt={`Product image ${index + 1}`} className="w-full h-full object-cover" />
                        <button type="button" onClick={() => handleRemoveSelectedImage(index)} className="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/70 text-white flex items-center justify-center" aria-label={`Remove image ${index + 1}`}>
                          <X className="w-3 h-3" />
                        </button>
                        <span className="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[9px] text-center font-semibold">{index + 1}</span>
                      </div>
                    ))}
                  </div>
                )}
                <p className="text-[10px] text-muted-foreground text-center mt-2">
                  Up to 5 images • JPG, PNG, WEBP • 5MB each
                </p>
            ) : (
              <div
                onDragEnter={'''
          if anchor not in s: raise SystemExit('preview anchor missing')
          s=s.replace(anchor,insert,1)

          s=s.replace('Click to upload or drag & drop','Click to upload up to 5 images',1)
          s=s.replace('JPG, JPEG, PNG, WEBP up to 5MB','JPG, JPEG, PNG, WEBP • Max 5MB each',1)

          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/components/pages/AddEditProduct.tsx
          git commit -m "Add multiple product image upload"
          git push origin test/all-vendor
